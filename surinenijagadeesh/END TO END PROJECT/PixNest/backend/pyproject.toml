[project]
name = "pixnest-backend"
version = "0.1.0"
description = "pixnest backend - FastAPI photo API (S3 + Postgres)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "starlette>=1.3.1",  # CVE-2025-62727, CVE-2026-48818, CVE-2026-54283
    "uvicorn[standard]==0.34.0",
    "gunicorn==23.0.0",
    "sqlalchemy[asyncio]>=2.0.36",   # >=2.0.36 for Python 3.13/3.14 support
    "asyncpg==0.30.0",
    "aiosqlite==0.20.0",
    "boto3==1.35.90",
    "pydantic-settings==2.3.4",
    "python-multipart==0.0.30",  # CVE-2024-53981, CVE-2026-24486, CVE-2026-42561, CVE-2026-53539
    "pyjwt==2.13.0",
    "bcrypt==4.2.1",
]

[dependency-groups]
dev = [
    "pytest==8.2.0",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "moto[s3]==5.0.10",
    "ruff==0.6.9",
]

[tool.uv]
package = false   # this is an application, not a library - install deps only, no build backend

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import-sort, B bugbear, UP pyupgrade, C4 comprehensions.
select = ["E", "W", "F", "I", "B", "UP", "C4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

