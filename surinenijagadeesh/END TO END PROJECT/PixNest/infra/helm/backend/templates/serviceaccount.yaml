apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
  # With EKS Pod Identity (default), no annotation is needed: a Pod Identity association
  # (created by Terraform) binds this ServiceAccount to the role. The annotation below is only
  # for the legacy IRSA path, used when serviceAccount.roleArn is set.
  {{- if .Values.serviceAccount.roleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn }}
  {{- end }}
