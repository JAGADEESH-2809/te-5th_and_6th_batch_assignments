# Local-only dependency for a minikube run: MinIO as an S3 stand-in (in AWS this is the managed
# S3 service, reached via Pod Identity). Postgres is NOT here - it ships in the Helm chart as a
# StatefulSet, so it is the same in local and EKS.
apiVersion: v1
kind: Namespace
metadata:
  name: pixnest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: pixnest
spec:
  replicas: 1
  selector:
    matchLabels: { app: minio }
  template:
    metadata:
      labels: { app: minio }
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - { name: MINIO_ROOT_USER, value: minioadmin }
            - { name: MINIO_ROOT_PASSWORD, value: minioadmin }
          ports:
            - containerPort: 9000
            - containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: pixnest
spec:
  selector: { app: minio }
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
# Creates the pixnest-photos bucket once MinIO is up.
apiVersion: batch/v1
kind: Job
metadata:
  name: createbucket
  namespace: pixnest
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: quay.io/minio/mc:latest
          command:
            - /bin/sh
            - -c
            - |
              until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done
              mc mb -p local/pixnest-photos
              echo "bucket ready"

