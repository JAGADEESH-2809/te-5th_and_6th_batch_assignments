# Argo CD - the default install. No Ingress, no load balancer, nothing public.
#
#   helm repo add argo https://argoproj.github.io/argo-helm
#   helm upgrade --install argocd argo/argo-cd -n argocd --create-namespace \
#     --version 10.9.0 -f infra/platform/argocd/values.yaml --wait
#
# Reach the UI over a local tunnel, which costs nothing and exposes nothing:
#
#   kubectl -n argocd port-forward svc/argocd-server 8080:80
#   # then http://localhost:8080   (user: admin)
#
# Note the port. Both Service ports 80 and 443 forward to container port 8080, and because
# server.insecure is set below, that container speaks plain HTTP. Forwarding 8080:443 and
# opening https:// therefore fails with a connection reset - the client offers TLS and the
# server answers HTTP. With insecure mode, use port 80 and http://.
#   kubectl -n argocd get secret argocd-initial-admin-secret -o go-template='{{.data.password | base64decode}}'
#
# Why no Ingress by default:
#   - Argo CD's admin holds cluster-admin on this cluster and a GitHub token with write access
#     to the repo. Putting that login on a public HTTP endpoint sends the password across the
#     internet in cleartext.
#   - An ALB costs about $16 a month, and Argo CD needs its own because it cannot share the
#     app's (both serve path "/" with no hostname to separate them).
#
# To expose it anyway - only with TLS - add values-alb-ingress.yaml as a second -f flag and
# read its header first.

configs:
  params:
    # Serve plain HTTP inside the cluster. With port-forward the tunnel is the security
    # boundary, and this avoids the self-signed certificate warning on every request.
    # If you ever expose this beyond localhost, TLS has to come back.
    server.insecure: true

server:
  ingress:
    # The whole point of this file. Turning this on creates a public load balancer.
    enabled: false
