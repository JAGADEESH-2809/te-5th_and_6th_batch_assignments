name: ci

# Run title in the Actions list: says whether this run only tested, or also shipped images.
run-name: >-
  ci ${{ github.event_name == 'pull_request' && 'test' || 'test + build + deploy' }}
  · ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.number) || github.ref_name }}

# Application pipeline. Test on every PR; on push to main also build, scan and push images,
# then bump the Helm image tags in Git so Argo CD rolls the change out.
#
# Infrastructure is NOT here - it lives in terraform.yml, deliberately. Different blast radius,
# different approval, different cadence.
on:
  push:
    branches: [main]
    paths:
      - "surinenijagadeesh/END TO END PROJECT/PixNest/backend/**"
      - "surinenijagadeesh/END TO END PROJECT/PixNest/frontend/**"
      - "surinenijagadeesh/END TO END PROJECT/PixNest/infra/helm/**"
      - ".github/workflows/ci.yml"

  pull_request:
    branches: [main]
    paths:
      - "surinenijagadeesh/END TO END PROJECT/PixNest/backend/**"
      - "surinenijagadeesh/END TO END PROJECT/PixNest/frontend/**"
      - "surinenijagadeesh/END TO END PROJECT/PixNest/infra/helm/**"

  # Manual run. Defaults to rebuilding everything.
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Which images to rebuild"
        type: choice
        default: all
        options: [all, backend, frontend]

# One run per branch. PR runs are superseded by newer pushes; main runs are NEVER cancelled,
# so a deploy cannot die between the image push and the GitOps tag bump.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; jobs that need more elevate individually.
permissions:
  contents: read

jobs:

  # ---------------------------------------------------------------------------
  # Work out what actually changed, so a frontend edit does not rebuild and
  # redeploy the backend. Every downstream job keys off these outputs.
  # ---------------------------------------------------------------------------
  changes:
    name: what changed
    runs-on: ubuntu-latest

    # On a pull_request, paths-filter asks the GitHub API which files the PR touches rather
    # than diffing locally, and that needs pull-requests: read.
    permissions:
      contents: read
      pull-requests: read

    outputs:
      backend: ${{ steps.decide.outputs.backend }}
      frontend: ${{ steps.decide.outputs.frontend }}
      charts: ${{ steps.decide.outputs.charts }}

    steps:
      - uses: actions/checkout@v7

      # Only meaningful for push and pull_request.
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            backend:
              - 'surinenijagadeesh/END TO END PROJECT/PixNest/backend/**'
            frontend:
              - 'surinenijagadeesh/END TO END PROJECT/PixNest/frontend/**'
            charts:
              - 'surinenijagadeesh/END TO END PROJECT/PixNest/infra/helm/**'
              - 'surinenijagadeesh/END TO END PROJECT/PixNest/infra/terraform/**'

      # The path filter cannot be trusted on a manual run.
      - name: Decide what to build
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          REBUILD: ${{ inputs.rebuild }}
          F_BACKEND: ${{ steps.filter.outputs.backend }}
          F_FRONTEND: ${{ steps.filter.outputs.frontend }}
          F_CHARTS: ${{ steps.filter.outputs.charts }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$REBUILD" in
              all)
                BE=true
                FE=true
                CH=true
                ;;
              backend)
                BE=true
                FE=false
                CH=false
                ;;
              frontend)
                BE=false
                FE=true
                CH=false
                ;;
              *)
                echo "::error::unknown rebuild option '$REBUILD'"
                exit 1
                ;;
            esac

            SOURCE="manual choice: $REBUILD"
          else
            BE="$F_BACKEND"
            FE="$F_FRONTEND"
            CH="$F_CHARTS"
            SOURCE="changed paths"
          fi

          {
            echo "backend=$BE"
            echo "frontend=$FE"
            echo "charts=$CH"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### What will be built"
            echo
            echo "Decided by: **$SOURCE**"
            echo
            echo "| component | build |"
            echo "|-----------|-------|"
            echo "| backend   | $BE |"
            echo "| frontend  | $FE |"
            echo "| charts    | $CH |"
          } >> "$GITHUB_STEP_SUMMARY"


  backend-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.10"

      - name: Sync deps (from the lockfile)
        working-directory: surinenijagadeesh/END TO END PROJECT/PixNest/backend
        run: uv sync --frozen

      - name: Lint
        working-directory: surinenijagadeesh/END TO END PROJECT/PixNest/backend
        run: uv run ruff check . && uv run ruff format --check .

      - name: Test (with coverage gate)
        working-directory: surinenijagadeesh/END TO END PROJECT/PixNest/backend
        run: uv run pytest -q --cov=app --cov-fail-under=80


  frontend-build:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: surinenijagadeesh/END TO END PROJECT/PixNest/frontend/package-lock.json

      - name: Install
        working-directory: surinenijagadeesh/END TO END PROJECT/PixNest/frontend
        run: npm ci

      - name: Build
        working-directory: surinenijagadeesh/END TO END PROJECT/PixNest/frontend
        run: npm run build


  # Charts and Terraform are validated together.
  lint-infra:
    needs: changes
    if: needs.changes.outputs.charts == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Helm lint + render (all three charts, base + overlays)
        run: |
          for chart in postgres backend frontend; do
            helm lint "surinenijagadeesh/END TO END PROJECT/PixNest/infra/helm/$chart"
            helm template "pixnest-$chart" "surinenijagadeesh/END TO END PROJECT/PixNest/infra/helm/$chart" >/dev/null

            for overlay in values-local.yaml values-eks.yaml; do
              if [ -f "surinenijagadeesh/END TO END PROJECT/PixNest/infra/helm/$chart/$overlay" ]; then
                helm template \
                  "pixnest-$chart" \
                  "surinenijagadeesh/END TO END PROJECT/PixNest/infra/helm/$chart" \
                  -f "surinenijagadeesh/END TO END PROJECT/PixNest/infra/helm/$chart/$overlay" \
                  >/dev/null
              fi
            done
          done

      - uses: hashicorp/setup-terraform@v4

      - name: Terraform fmt + validate (dev env root)
        working-directory: surinenijagadeesh/END TO END PROJECT/PixNest/infra/terraform/environments/dev
        run: |
          terraform fmt -check -recursive ../..
          terraform init -backend=false -input=false
          terraform validate


  # ---------------------------------------------------------------------------
  # Build, scan and push ONLY the images whose source changed.
  # ---------------------------------------------------------------------------
  images:
    needs: [changes, backend-test, frontend-build, lint-infra]

    if: >-
      always()
      && !cancelled()
      && needs.backend-test.result != 'failure'
      && needs.frontend-build.result != 'failure'
      && needs.lint-infra.result != 'failure'
      && github.event_name != 'pull_request'
      && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
      && vars.AWS_ACCOUNT_ID != ''
      && vars.AWS_REGION != ''
      && vars.AWS_GHA_ROLE_ARN != ''

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC, no static keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_GHA_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend image (local)
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./surinenijagadeesh/END TO END PROJECT/PixNest/backend
          load: true
          tags: ${{ env.REGISTRY }}/pixnest-backend:${{ github.sha }}

      - name: Build frontend image (local)
        if: needs.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./surinenijagadeesh/END TO END PROJECT/PixNest/frontend
          load: true
          tags: ${{ env.REGISTRY }}/pixnest-frontend:${{ github.sha }}

      # Trivy from Aqua's official apt repo.
      - name: Install Trivy
        run: |
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list >/dev/null

          sudo apt-get update -qq
          sudo apt-get install -y -qq trivy

      - name: Scan backend image (gate on CRITICAL/HIGH)
        if: needs.changes.outputs.backend == 'true'
        run: |
          trivy image \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            "$REGISTRY/pixnest-backend:$GITHUB_SHA"

      - name: Scan frontend image (gate on CRITICAL/HIGH)
        if: needs.changes.outputs.frontend == 'true'
        run: |
          trivy image \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            "$REGISTRY/pixnest-frontend:$GITHUB_SHA"

      # Pushes come after BOTH scans.
      - name: Push backend image
        if: needs.changes.outputs.backend == 'true'
        run: docker push "$REGISTRY/pixnest-backend:$GITHUB_SHA"

      - name: Push frontend image
        if: needs.changes.outputs.frontend == 'true'
        run: docker push "$REGISTRY/pixnest-frontend:$GITHUB_SHA"


  # ---------------------------------------------------------------------------
  # GitOps handoff: write the new tags into Helm values and commit.
  # ---------------------------------------------------------------------------
  gitops-bump:
    needs: [changes, images]

    if: always() && !cancelled() && needs.images.result == 'success'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Bump the image tags that were actually pushed
        run: |
          CHANGED=""

          if [ "${{ needs.changes.outputs.backend }}" = "true" ]; then
            yq -i '.image.tag = "${{ github.sha }}"' \
              "surinenijagadeesh/END TO END PROJECT/PixNest/infra/helm/backend/values.yaml"

            CHANGED="$CHANGED surinenijagadeesh/END TO END PROJECT/PixNest/infra/helm/backend/values.yaml"
          fi

          if [ "${{ needs.changes.outputs.frontend }}" = "true" ]; then
            yq -i '.image.tag = "${{ github.sha }}"' \
              "surinenijagadeesh/END TO END PROJECT/PixNest/infra/helm/frontend/values.yaml"

            CHANGED="$CHANGED surinenijagadeesh/END TO END PROJECT/PixNest/infra/helm/frontend/values.yaml"
          fi

          echo "CHANGED_FILES=$CHANGED" >> "$GITHUB_ENV"

      - name: Commit the bump
        run: |
          [ -n "$CHANGED_FILES" ] || { echo "nothing to bump"; exit 0; }

          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"

          if [ "${{ needs.changes.outputs.backend }}" = "true" ]; then
            git add -- "surinenijagadeesh/END TO END PROJECT/PixNest/infra/helm/backend/values.yaml"
          fi

          if [ "${{ needs.changes.outputs.frontend }}" = "true" ]; then
            git add -- "surinenijagadeesh/END TO END PROJECT/PixNest/infra/helm/frontend/values.yaml"
          fi

          # [skip ci] so this bump to infra/helm does not trigger another CI run (no loop).
          git commit -m "ci: deploy ${GITHUB_SHA::7} [skip ci]" || {
            echo "no changes"
            exit 0
          }

          # main may have moved while this run was in flight; rebase and retry.
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main
          done

          git push